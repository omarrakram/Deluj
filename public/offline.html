<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fb4e12" />
<title>Deluj · Reconnecting</title>
<style>
  html,body{margin:0;height:100%;background:#fb4e12;color:#fff7ee;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  .mark{width:180px;aspect-ratio:2048/744;background:#abd1e9;-webkit-mask:url(/brand/deluj-wordmark.svg) center/contain no-repeat;mask:url(/brand/deluj-wordmark.svg) center/contain no-repeat;margin:0 auto 40px}
  h1{font-size:32px;line-height:1.1;margin:0 0 12px;letter-spacing:-.02em}
  p{font-size:18px;opacity:.9;margin:0 auto;max-width:22rem}
  button{margin-top:28px;height:52px;padding:0 28px;border:0;border-radius:999px;background:#fff7ee;color:#c2380a;font-weight:700;font-size:16px}
</style>
</head>
<body>
<main>
  <div>
    <div class="mark" role="img" aria-label="Deluj"></div>
    <h1>We've lost the connection.</h1>
    <p>Your cart is safe on this phone. As soon as the Wi-Fi is back, you can pick up right where you left off.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>
